<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>용사 장비창 & 스킬셋 — UI 캔버스</title>
  <style>
    :root{--bg:#0f1226;--panel:#0f2338;--accent:#8b63ff;--muted:#bfc9d9;--card:#15182b}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, Arial;background:linear-gradient(180deg,#0b0d18 0%, #111428 100%);color:var(--muted)}
    .wrap{width:100%;height:100vh;display:flex;align-items:center;justify-content:center}
    canvas{box-shadow:0 10px 40px rgba(0,0,0,.6);border-radius:8px;background:#0b1222}
    .info{position:fixed;right:18px;top:18px;color:#cfd8ff;font-size:13px;opacity:.9}
    .hint{position:fixed;left:18px;top:18px;color:#d8d8e8;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="uiCanvas" width="1440" height="1024" role="img" aria-label="게임 UI 스탯 화면"></canvas>
  </div>
  <div class="hint">화면을 클릭하면 장비/스킬 설명이 보입니다.</div>
  <script>
    const canvas = document.getElementById('uiCanvas');
    const ctx = canvas.getContext('2d');

    // Game data (current user-provided state)
    const state = {
      energy: 55,
      energyMax: 100,
      mood: 40,
      annoyance: 10,
      focus: 60,
      serenity: 65, // aggregate '여유' stat
      progress: 100, // percent
      equipment: [
        {name:'정중한 무심함의 방패', rarity:'Legendary', desc:'외부 방해 80% 감소'},
        {name:'화이트노이즈 오브', rarity:'Common', desc:'주변 소음 60% 감소'},
        {name:'차분한 체온 머그', rarity:'Consumable', desc:'마음 안정 +10 (5분)'}
      ],
      skills: [
        {name:'딜레이 카운터', type:'Active', desc:'"잠시만요"로 말걸기 70% 무력화'},
        {name:'내 안의 집중의 방', type:'Passive', desc:'소음 데미지 30% 감소 (1hr)'},
        {name:'예의+거리 전투', type:'Passive', desc:'상대의 관심도 감소 (부드러운 역공)'}
      ]
    }

    // helper draws
    function roundRect(x,y,w,h,r,fill,stroke){
      ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
      if(fill){ctx.fillStyle=fill;ctx.fill();}
      if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}
    }

    function drawUI(){
      // background gradient
      const g=ctx.createLinearGradient(0,0,0,canvas.height);
      g.addColorStop(0,'#0b0f1a'); g.addColorStop(1,'#071022');
      ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);

      // Left panel - Equipment
      roundRect(40,60,360,900,12,'rgba(20,28,45,0.9)','rgba(255,255,255,0.03)');
      ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font='600 20px sans-serif'; ctx.fillText('Equipment',60,94);
      ctx.font='14px sans-serif'; ctx.fillStyle='rgba(200,210,230,0.9)';
      for(let i=0;i<state.equipment.length;i++){
        const y=140 + i*140;
        roundRect(56,y,328,112,10,'rgba(14,20,34,0.7)','rgba(255,255,255,0.03)');
        // icon
        roundRect(68,y+16,56,56,8,'#1a2233');
        ctx.fillStyle='#c9b3ff'; ctx.font='700 12px sans-serif'; ctx.fillText(state.equipment[i].rarity,136,y+40);
        ctx.fillStyle='#e8eefc'; ctx.font='600 16px sans-serif'; ctx.fillText(state.equipment[i].name,136,y+24);
        ctx.fillStyle='#b8c6dd'; ctx.font='13px sans-serif'; ctx.fillText(state.equipment[i].desc,136,y+56);
      }

      // Right panel - Skills
      roundRect(1040,60,360,900,12,'rgba(20,28,45,0.9)','rgba(255,255,255,0.03)');
      ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font='600 20px sans-serif'; ctx.fillText('Skill Set',1060,94);
      ctx.font='14px sans-serif'; ctx.fillStyle='rgba(200,210,230,0.9)';
      for(let i=0;i<state.skills.length;i++){
        const y=140 + i*120;
        roundRect(1056,y,328,96,8,'rgba(14,20,34,0.72)','rgba(255,255,255,0.03)');
        ctx.fillStyle='#ffd9a8'; ctx.font='700 12px sans-serif'; ctx.fillText(state.skills[i].type,1116,y+28);
        ctx.fillStyle='#e8eefc'; ctx.font='600 16px sans-serif'; ctx.fillText(state.skills[i].name,1116,y+20);
        ctx.fillStyle='#b8c6dd'; ctx.font='13px sans-serif'; ctx.fillText(state.skills[i].desc,1116,y+52);
      }

      // Center character box
      roundRect(440,120,560,780,14,'rgba(18,25,38,0.95)','rgba(255,255,255,0.03)');
      // draw avatar (stylized armor)
      drawAvatar(720,360);

      // Stats card below avatar
      roundRect(500,560,440,200,12,'rgba(10,16,26,0.7)');
      ctx.fillStyle='#dfe7ff'; ctx.font='700 18px sans-serif'; ctx.fillText('Status',520,588);
      // stat bars
      drawStatBar(520,610,'Energy',state.energy,state.energyMax,'#ff7fb8');
      drawStatBar(520,650,'Mood',state.mood,100,'#8b63ff');
      drawStatBar(520,690,'Annoyance',100-state.annoyance,100,'#7dd3fc');
      drawStatBar(520,730,'Focus',state.focus,100,'#ffd166');

      // bottom center - progress
      ctx.fillStyle='#cbd6ff'; ctx.font='600 14px sans-serif'; ctx.fillText('Progress to Calm (금요일 영역)',580,790);
      roundRect(580,800,280,16,8,'#132032');
      ctx.fillStyle='#82e7a8'; ctx.fillRect(580,800,(state.progress/100)*280,16);

      // footer hint
      ctx.fillStyle='rgba(200,210,230,0.7)'; ctx.font='13px sans-serif'; ctx.fillText('Click on equipment or skill area to view details',520,840);
    }

    function drawStatBar(x,y,label,val,max,color){
      ctx.fillStyle='#9aa7c7'; ctx.font='600 13px sans-serif'; ctx.fillText(label, x, y+10);
      // bar background
      roundRect(x+120,y-6,260,18,8,'#0f1530');
      // bar fill
      const w = Math.max(0, Math.min(1, val/max))*260;
      const grad = ctx.createLinearGradient(x+120,y,x+120+w,y);
      grad.addColorStop(0,'#ffffff22'); grad.addColorStop(1,color);
      ctx.fillStyle=grad; ctx.fillRect(x+120,y-6,w,18);
      ctx.fillStyle='#dbe7ff'; ctx.font='600 12px sans-serif'; ctx.fillText(Math.round(val)+"/"+max, x+390, y+10);
    }

    function drawAvatar(cx,cy){
      // simple stylized armored figure
      // head
      ctx.fillStyle='#e6eefc'; ctx.beginPath(); ctx.ellipse(cx,cy-70,40,44,0,0,Math.PI*2); ctx.fill();
      // helmet visor
      ctx.fillStyle='#111827'; ctx.fillRect(cx-28,cy-84,56,18);
      // body armor
      ctx.fillStyle='#8b93a8'; roundRect(cx-70,cy-20,140,160,18,'#8b93a8');
      // pauldrons
      ctx.fillStyle='#6d7480'; roundRect(cx-102,cy-20,40,40,10,'#6d7480'); roundRect(cx+62,cy-20,40,40,10,'#6d7480');
      // shield (left)
      roundRect(cx-140,cy+40,64,96,8,'#6b4bcc');
      ctx.fillStyle='#cfc5ff'; ctx.font='600 12px sans-serif'; ctx.fillText('Shield',cx-128,cy+56);
      // sword (right)
      ctx.fillStyle='#c9ccd6'; roundRect(cx+80,cy+36,12,84,6,'#c9ccd6');
      // glow aura
      const g=ctx.createRadialGradient(cx,cy,20,cx,cy,140);
      g.addColorStop(0,'rgba(139,99,255,0.14)'); g.addColorStop(1,'rgba(139,99,255,0)');
      ctx.fillStyle=g; ctx.fillRect(cx-140,cy-140,280,280);
    }

    drawUI();

    // interactivity: clicking on left/right areas shows alert with details (simple)
    canvas.addEventListener('click', (e)=>{
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left)*(canvas.width/r.width);
      const y = (e.clientY - r.top)*(canvas.height/r.height);

      // equipment area
      if(x>56 && x<384 && y>140 && y<500){
        const idx = Math.floor((y-140)/140);
        const item = state.equipment[idx];
        if(item) showPopup(item.name+' — '+item.desc+' ('+item.rarity+')');
      }
      // skills area
      if(x>1056 && x<1384 && y>140 && y<420){
        const idx = Math.floor((y-140)/120);
        const sk = state.skills[idx];
        if(sk) showPopup(sk.name+' — '+sk.desc+' ('+sk.type+')');
      }
    });

    function showPopup(text){
      // transient tooltip
      ctx.save();
      roundRect(520,880,400,72,10,'rgba(10,16,28,0.95)');
      ctx.fillStyle='#e6eeff'; ctx.font='600 14px sans-serif'; ctx.fillText(text,540,920);
      ctx.restore();
      setTimeout(()=>{ drawUI(); },2200);
    }

  </script>
</body>
</html>
