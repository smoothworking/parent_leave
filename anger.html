<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 다스리기</title>
    <style>
        :root {
            --bg-0: #f8f9fa;
            --bg-1: #fff3bf; /* 노랑 */
            --bg-2: #ffd8a8; /* 주황 */
            --bg-3: #ffc9c9; /* 핑크 */
            --bg-4: #ffaebc; /* 적색 계열 */
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Pretendard', sans-serif;
            transition: background-color 0.5s ease;
            background-color: var(--bg-0);
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        /* 집 이미지 영역 */
        .house-container {
            position: relative;
            font-size: 80px;
            margin-bottom: 50px;
            display: inline-block;
        }

        /* 불 이모지 레이아웃 */
        #fire-garden {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap-reverse;
            justify-content: center;
            width: 200px; /* 한 줄에 약 5-6개 정렬 */
            pointer-events: none;
        }

        .fire-emoji {
            font-size: 30px;
            margin: -5px;
            animation: burn 0.5s ease-out forwards;
        }

        @keyframes burn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 버튼 영역 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.9); }

        .btn-water { background-color: #228be6; color: white; }
        .btn-fire { background-color: #fab005; color: white; }

    </style>
</head>
<body>

<div class="container">
    <div class="house-container">
        🏠
        <div id="fire-garden"></div>
    </div>

    <div class="controls">
        <button class="btn btn-water" onclick="coolDown()">💧</button>
        <button class="btn btn-fire" onclick="heatUp()">🔥</button>
    </div>
</div>

<script>
    const fireGarden = document.getElementById('fire-garden');
    const body = document.body;
    let fireCount = 0;

    // 한 줄당 불 개수 기준
    const PER_LINE = 6;

    function updateBackground() {
        const lines = Math.floor(fireCount / PER_LINE);
        
        if (fireCount === 0) body.style.backgroundColor = 'var(--bg-0)';
        else if (lines === 0) body.style.backgroundColor = 'var(--bg-1)';
        else if (lines === 1) body.style.backgroundColor = 'var(--bg-2)';
        else if (lines === 2) body.style.backgroundColor = 'var(--bg-3)';
        else body.style.backgroundColor = 'var(--bg-4)';
    }

    function heatUp() {
        fireCount++;
        const fire = document.createElement('span');
        fire.className = 'fire-emoji';
        fire.innerText = '🔥';
        fireGarden.appendChild(fire);
        updateBackground();
    }

    function coolDown() {
        if (fireCount > 0) {
            fireCount--;
            fireGarden.removeChild(fireGarden.lastChild);
            updateBackground();
        }
    }
</script>

</body>
</html>
