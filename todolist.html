<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Daily Todo</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111827;
      display: flex;
      justify-content: center;   /* 가로 가운데 */
      align-items: flex-start;   /* 위쪽 정렬 */
      height: 100vh;             /* 화면 높이 기준 */
      overflow: hidden;          /* 바깥 스크롤 막고, 안쪽(content)만 스크롤 */
    }

    .app {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      height: 100%;              /* 🔸 이 부분 추가: 앱 높이를 화면 높이에 고정 */
    }

    /* 가운데 스크롤 영역 */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 16px;
      padding-bottom: 140px; /* 하단 입력창만큼 여백 */
    }

    /* 상단 인사 영역 (content 내부에서 sticky) */
    .header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 20px 0 16px;
      background: #fff;
    }
    .title-main {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
    }
    .date-text {
      font-size: 14px;
      color: #6b7280;
      text-align: center;
    }

    h2 {
      font-size: 14px;
      margin: 18px 0 6px;
    }
    .section-label {
      font-weight: 700;
    }

    .section-subtext {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    .todo-card, .done-card {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 18px;
      background: #f9fafb;
      margin-bottom: 8px;
      border: 1px solid #e5e7eb;
    }
    .done-card {
      background: #e5e7eb;
    }

    .check-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      background: #f9fafb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      cursor: pointer;
    }
    .check-btn.done {
      background: #4b5563;
      border-color: #4b5563;
      color: #fff;
    }
    .check-icon {
      font-size: 14px;
    }

    .todo-main {
      flex: 1;
      min-width: 0;
    }
    .todo-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .todo-desc {
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge-urgent {
      font-size: 11px;
      color: #ef4444;
      border: 1px solid #fecaca;
      padding: 2px 6px;
      border-radius: 999px;
      margin-left: 6px;
    }
    .right-meta {
      font-size: 11px;
      color: #6b7280;
      margin-left: 8px;
      white-space: nowrap;
    }
    .delete-btn {
      border: none;
      background: transparent;
      color: #9ca3af;
      cursor: pointer;
      font-size: 16px;
      margin-left: 4px;
    }

    .empty-text {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    /* 하단 입력 바: 화면 기준 고정 (ChatGPT 스타일) */
    .add-card {
      position: fixed;
      left: 50%;
      bottom: 16px;                    /* 화면 하단에서 살짝 띄우기 */
      transform: translateX(-50%);
      width: calc(100% - 32px);        /* body padding 16px 고려 */
      max-width: 480px;                /* app 폭과 동일 */
      z-index: 10;
      border: none;
      background: transparent;
    }
    .add-inner {
      padding: 12px 12px 10px;
      border-radius: 18px;
      background: #fdfdfd;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .add-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 13px;
      margin-bottom: 6px;
      outline: none;
    }
    .add-input::placeholder {
      color: #c4c4c4;
    }
    .add-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #6b7280;
    }
    .checkbox-inline input {
      width: 14px;
      height: 14px;
    }
    .btn-primary {
      border-radius: 999px;
      border: none;
      padding: 6px 16px;
      font-size: 12px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="content">
      <div class="header">
        <div class="title-main" id="greetingText">Good Day 🍀</div>
        <div class="date-text" id="todayText"></div>
      </div>

      <h2><span class="section-label">To Do</span></h2>
      <div id="todoSub" class="section-subtext" style="display:none;">
        할 일을 추가해 보세요.
      </div>
      <div id="todoList"></div>

      <h2><span class="section-label">Done</span></h2>
      <div id="doneEmpty" class="section-subtext" style="display:none;">
        최근 7일 동안 완료한 일이 없습니다.
      </div>
      <div id="doneList"></div>
    </div>
  </div>

  <!-- 화면 하단 고정 입력 영역 -->
  <div class="add-card">
    <div class="add-inner">
      <input id="newTitle" class="add-input" type="text" placeholder="할 일 제목" />
      <input id="newDesc" class="add-input" type="text" placeholder="보조 설명 (선택)" />
      <div class="add-row">
        <label class="checkbox-inline">
          <input type="checkbox" id="newUrgent" />
          <span>긴급</span>
        </label>
        <button class="btn-primary" id="addBtn">추가하기</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "todo_app_v1";
    const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

    const GREETINGS = [
      "Good Day 🍀",
      "오늘도 차분하게 가볼까요 🌿",
      "조용하지만 좋은 날이에요 ☕",
      "마음이 편안한 하루 되길 🌙",
      "오늘은 나를 위해 쓰는 날 ✨",
      "작게 시작해도 괜찮은 날 🌱",
      "숨 고르고 천천히 가요 🍃",
      "오늘도 여기까지 온 나, 최고 👍",
      "가볍게, 하지만 진심으로 💫",
      "오늘의 나에게 부드럽게 대하기 🫧"
    ];

    function getDailyGreeting() {
      const todayKey = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
      let sum = 0;
      for (const ch of todayKey) sum += ch.charCodeAt(0);
      const idx = sum % GREETINGS.length;
      return GREETINGS[idx];
    }

    function formatTodayKorean() {
      const now = new Date();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const weekdayNames = ["일", "월", "화", "수", "목", "금", "토"];
      const w = weekdayNames[now.getDay()];
      return `오늘은 ${m}월 ${d}일(${w})입니다.`;
    }

    function formatMonthDay(dateStr) {
      const d = new Date(dateStr);
      const m = d.getMonth() + 1;
      const day = d.getDate();
      return `${m}/${day}`;
    }

    function loadTasks() {
      const raw = localStorage.getItem(STORAGE_KEY) || "[]";
      try {
        return JSON.parse(raw);
      } catch (e) {
        console.error("JSON error, reset.", e);
        return [];
      }
    }

    function saveTasks(tasks) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function cleanupOldDone() {
      let tasks = loadTasks();
      const now = Date.now();
      tasks = tasks.filter(t => {
        if (!t.completedAt) return true;
        const diff = now - new Date(t.completedAt).getTime();
        return diff < WEEK_MS;
      });
      saveTasks(tasks);
    }

    function addTask(title, desc, urgent) {
      const tasks = loadTasks();
      const id = "t-" + Date.now();
      tasks.push({
        id,
        title,
        desc,
        urgent,
        createdAt: new Date().toISOString(),
        completedAt: null
      });
      saveTasks(tasks);
      render();
    }

    function toggleTask(id) {
      const tasks = loadTasks();
      const nowIso = new Date().toISOString();
      const updated = tasks.map(t => {
        if (t.id === id) {
          if (t.completedAt) {
            return { ...t, completedAt: null };
          } else {
            return { ...t, completedAt: nowIso };
          }
        }
        return t;
      });
      saveTasks(updated);
      cleanupOldDone();
      render();
    }

    function deleteTask(id) {
      let tasks = loadTasks();
      tasks = tasks.filter(t => t.id !== id);
      saveTasks(tasks);
      render();
    }

    function render() {
      const tasks = loadTasks();
      const now = Date.now();

      const todos = tasks.filter(t => !t.completedAt);
      const dones = tasks.filter(
        t => t.completedAt && (now - new Date(t.completedAt).getTime() < WEEK_MS)
      );

      const todoList = document.getElementById("todoList");
      const todoSub = document.getElementById("todoSub");
      const doneList = document.getElementById("doneList");
      const doneEmpty = document.getElementById("doneEmpty");

      // To Do
      if (todos.length === 0) {
        todoSub.style.display = "block";
        todoList.innerHTML = "";
      } else {
        todoSub.style.display = "none";
        todoList.innerHTML = todos
          .map(
            t => `
            <div class="todo-card">
              <button class="check-btn" onclick="toggleTask('${t.id}')">
                <span class="check-icon">✓</span>
              </button>
              <div class="todo-main">
                <div class="todo-title">
                  ${escapeHtml(t.title)}
                  ${t.urgent ? '<span class="badge-urgent">긴급</span>' : ""}
                </div>
                ${t.desc ? `<div class="todo-desc">${escapeHtml(t.desc)}</div>` : ""}
              </div>
              <button class="delete-btn" onclick="deleteTask('${t.id}')">×</button>
            </div>
          `
          )
          .join("");
      }

      // Done
      if (dones.length === 0) {
        doneEmpty.style.display = "block";
        doneList.innerHTML = "";
      } else {
        doneEmpty.style.display = "none";
        dones.sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
        doneList.innerHTML = dones
          .map(
            t => `
            <div class="done-card">
              <button class="check-btn done" onclick="toggleTask('${t.id}')">
                <span class="check-icon">✓</span>
              </button>
              <div class="todo-main">
                <div class="todo-title">
                  ${escapeHtml(t.title)}
                  ${t.urgent ? '<span class="badge-urgent">긴급</span>' : ""}
                </div>
                ${t.desc ? `<div class="todo-desc">${escapeHtml(t.desc)}</div>` : ""}
              </div>
              <div class="right-meta">${formatMonthDay(t.completedAt)}</div>
            </div>
          `
          )
          .join("");
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("todayText").textContent = formatTodayKorean();
      document.getElementById("greetingText").textContent = getDailyGreeting();

      cleanupOldDone();
      render();

      const titleEl = document.getElementById("newTitle");
      const descEl = document.getElementById("newDesc");
      const urgentEl = document.getElementById("newUrgent");

      document.getElementById("addBtn").addEventListener("click", () => {
        const title = titleEl.value.trim();
        const desc = descEl.value.trim();
        const urgent = urgentEl.checked;

        if (!title) {
          alert("제목을 입력해 주세요.");
          titleEl.focus();
          return;
        }

        addTask(title, desc, urgent);
        titleEl.value = "";
        descEl.value = "";
        urgentEl.checked = false;
      });

      // 제목 입력 중 엔터로 추가
      titleEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("addBtn").click();
        }
      });
    });

    window.toggleTask = toggleTask;
    window.deleteTask = deleteTask;
  </script>
</body>
</html>
