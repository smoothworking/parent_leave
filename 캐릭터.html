<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 사용 현황</title>
    <style>
        :root {
            --primary-blue: #0055fb;
            --bg-gray: #f4f6f8;
            --text-dark: #1a1a1a;
            --card-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
        }

        .card-container {
            width: 100%;
            max-width: 360px;
            background: var(--card-white);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        /* 헤더: 레벨 및 공유하기 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .level-info {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .level-badge {
            color: var(--primary-blue);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .level-name {
            font-weight: 600;
            font-size: 1.2rem;
        }

        .share-btn {
            background: #f0f0f0;
            border: none;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* 중앙 그래픽 영역 */
        .character-zone {
            width: 200px;
            height: 200px;
            background: #e9ecef;
            border-radius: 20px;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 실제 캐릭터 이미지 삽입부 */
            font-size: 0.9rem;
            color: #adb5bd;
        }

        /* 하단 금액 정보 */
        .amount-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label {
            font-size: 0.95rem;
            color: #666;
            font-weight: 500;
        }

        .amount {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .unit {
            font-size: 0.9rem;
            font-weight: 500;
            margin-left: 2px;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="header">
        <div class="level-info">
            <span class="level-badge">Lv.3</span>
            <span class="level-name">베이비 모니</span>
        </div>
        <button class="share-btn">공유하기</button>
    </div>

    <div class="character-zone">
        캐릭터 이미지 영역
    </div>

    <div class="amount-card">
        <span class="label">OO카드 사용금액(누적)</span>
        <div class="amount">
            3,000,000<span class="unit">원</span>
        </div>
    </div>
</div>

</body>
</html>
