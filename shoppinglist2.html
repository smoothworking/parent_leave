<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>살 것 / 산 것 리스트</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      height: 100%;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 16px;
      padding-bottom: 140px; /* 하단 입력바 여유 */
    }

    /* 상단 인사/탭 영역 */
    .header {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 20px 0 8px;
      background: #fff;
    }
    .title-main {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
    }
    .date-text {
      font-size: 14px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 12px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
      margin-bottom: 10px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 14px;
      cursor: pointer;
      color: #6b7280;
      position: relative;
    }
    .tab-active {
      color: #111827;
      font-weight: 600;
    }
    .tab-active::after {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 0;
      height: 2px;
      border-radius: 999px;
      background: #111827;
    }

    h2 {
      font-size: 14px;
      margin: 16px 0 6px;
    }
    .section-label {
      font-weight: 700;
    }

    .section-subtext {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    .card {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 18px;
      background: #f9fafb;
      margin-bottom: 8px;
      border: 1px solid #e5e7eb;
    }

    .check-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      background: #f9fafb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 10px;
      cursor: pointer;
    }
    .check-icon {
      font-size: 14px;
    }

    .item-main {
      flex: 1;
      min-width: 0;
    }
    .item-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-desc {
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-urgent {
      font-size: 11px;
      color: #ef4444;
      border: 1px solid #fecaca;
      padding: 2px 6px;
      border-radius: 999px;
      margin-left: 6px;
    }

    .item-right {
      font-size: 11px;
      color: #6b7280;
      margin-left: 8px;
      white-space: nowrap;
      text-align: right;
    }

    .delete-btn {
      border: none;
      background: transparent;
      color: #9ca3af;
      cursor: pointer;
      font-size: 16px;
      margin-left: 4px;
    }

    .empty-text {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    /* 산 것 - 월/날짜/합계 UI */
    .month-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 4px 0 10px;
      font-size: 13px;
      color: #4b5563;
    }
    .month-arrow {
      cursor: pointer;
      user-select: none;
      padding: 4px 6px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      font-size: 11px;
      background: #f9fafb;
    }

    .date-group {
      margin-bottom: 14px;
    }
    .date-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .date-title {
      font-weight: 700;
    }
    .date-total {
      font-weight: 700;
      color: #2563eb;
    }

    .buy-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 4px 2px;
      font-size: 12px;
    }
    .buy-left {
      max-width: 70%;
    }
    .buy-store {
      color: #6b7280;
    }
    .buy-item {
      font-weight: 500;
    }
    .buy-price {
      font-weight: 600;
    }

    /* 하단 입력 바 – 살 것 탭에서만 표시 */
    .add-card {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 480px;
      z-index: 10;
      border: none;
      background: transparent;
      display: none;
    }
    .add-inner {
      padding: 12px 12px 10px;
      border-radius: 18px;
      background: #fdfdfd;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .add-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 13px;
      margin-bottom: 6px;
      outline: none;
    }
    .add-input::placeholder {
      color: #c4c4c4;
    }
    .add-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      margin-top: 4px;
    }
    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #6b7280;
    }
    .checkbox-inline input {
      width: 14px;
      height: 14px;
    }
    .btn-primary {
      border-radius: 999px;
      border: none;
      padding: 6px 16px;
      font-size: 12px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary:active {
      transform: translateY(1px);
    }

    /* 구매정보 입력 모달 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal {
      width: 320px;
      max-width: calc(100% - 40px);
      background: #fff;
      border-radius: 18px;
      padding: 18px 18px 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .modal-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .modal-label {
      font-size: 12px;
      margin-bottom: 3px;
    }
    .modal-input {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      padding: 7px 9px;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }
    .modal-input::placeholder {
      color: #c4c4c4;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-secondary {
      border-radius: 999px;
      border: none;
      padding: 6px 14px;
      font-size: 12px;
      background: #e5e7eb;
      color: #374151;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="content">
      <div class="header">
        <div class="title-main" id="greetingText">Good Day 🍀</div>
        <div class="date-text" id="todayText"></div>
        <div class="tabs">
          <div id="tabTodo" class="tab tab-active">살 것</div>
          <div id="tabDone" class="tab">산 것</div>
        </div>
      </div>

      <!-- 살 것 탭 -->
      <div id="todoSection">
        <h2><span class="section-label">살 것</span></h2>
        <div id="todoSub" class="section-subtext" style="display:none;">
          살 것들을 추가해 보세요.
        </div>
        <div id="todoList"></div>
      </div>

      <!-- 산 것 탭 -->
      <div id="doneSection" style="display:none;">
        <h2><span class="section-label">산 것</span></h2>
        <div class="month-header">
          <button class="month-arrow" id="prevMonthBtn">◀</button>
          <div id="monthLabel">&lt; 10월 &gt;</div>
          <button class="month-arrow" id="nextMonthBtn">▶</button>
        </div>
        <div id="doneEmpty" class="section-subtext" style="display:none;">
          선택한 월에는 아직 구매 기록이 없습니다.
        </div>
        <div id="doneList"></div>
      </div>
    </div>
  </div>

  <!-- 하단 입력 바 (살 것 전용) -->
  <div class="add-card" id="addBar">
    <div class="add-inner">
      <input id="newTitle" class="add-input" type="text" placeholder="살 것 이름" />
      <input id="newDesc" class="add-input" type="text" placeholder="보조 설명 (선택)" />
      <div class="add-row">
        <label class="checkbox-inline">
          <input type="checkbox" id="newUrgent" />
          <span>긴급</span>
        </label>
        <button class="btn-primary" id="addBtn">추가하기</button>
      </div>
    </div>
  </div>

  <!-- 구매 정보 입력 모달 -->
  <div class="modal-backdrop" id="purchaseModalBackdrop">
    <div class="modal">
      <div class="modal-title">구매 정보를 입력하세요</div>
      <div class="modal-label">금액</div>
      <input id="purchasePrice" class="modal-input" type="number" min="0" placeholder="숫자 입력 (원)" />
      <div class="modal-label">구매처</div>
      <input id="purchaseStore" class="modal-input" type="text" placeholder="마트, 온라인몰 등" />
      <div class="modal-footer">
        <button class="btn-secondary" id="cancelPurchaseBtn">취소</button>
        <button class="btn-primary" id="confirmPurchaseBtn">확인</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "shopping_app_v1";

    const GREETINGS = [
      "Good Day 🍀",
      "오늘도 차분하게 가볼까요 🌿",
      "조용하지만 좋은 날이에요 ☕",
      "마음이 편안한 하루 되길 🌙",
      "오늘은 나를 위해 쓰는 날 ✨",
      "작게 시작해도 괜찮은 날 🌱",
      "숨 고르고 천천히 가요 🍃",
      "오늘도 여기까지 온 나, 최고 👍",
      "가볍게, 하지만 진심으로 💫",
      "오늘의 나에게 부드럽게 대하기 🫧"
    ];

    function getDailyGreeting() {
      const todayKey = new Date().toISOString().slice(0, 10);
      let sum = 0;
      for (const ch of todayKey) sum += ch.charCodeAt(0);
      return GREETINGS[sum % GREETINGS.length];
    }

    function formatTodayKorean() {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const weekdayNames = ["일", "월", "화", "수", "목", "금", "토"];
      const w = weekdayNames[now.getDay()];
      return `오늘은 ${y}년 ${m}월 ${d}일(${w})입니다.`;
    }

    function formatDateLabel(dateStr) {
      const d = new Date(dateStr);
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const weekday = ["일","월","화","수","목","금","토"][d.getDay()];
      return `${m}월 ${day}일(${weekday})`;
    }

    function formatMonthLabel(year, month) {
      return `&lt; ${year}년 ${month}월 &gt;`;
    }

    function formatPrice(num) {
      if (typeof num !== "number") return "";
      return num.toLocaleString("ko-KR") + "원";
    }

    function loadItems() {
      const raw = localStorage.getItem(STORAGE_KEY) || "[]";
      try {
        return JSON.parse(raw);
      } catch {
        return [];
      }
    }

    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function addItem(title, desc, urgent) {
      const items = loadItems();
      const id = "i-" + Date.now();
      items.push({
        id,
        title,
        desc,
        urgent,
        status: "todo", // "todo" | "done"
        createdAt: new Date().toISOString(),
        purchasedAt: null,
        price: null,
        store: null
      });
      saveItems(items);
      render();
    }

    function deleteItem(id) {
      let items = loadItems();
      items = items.filter(i => i.id !== id);
      saveItems(items);
      render();
    }

    function markAsBought(id, price, store) {
      const items = loadItems();
      const nowIso = new Date().toISOString();
      const updated = items.map(i =>
        i.id === id
          ? { ...i, status: "done", purchasedAt: nowIso, price, store }
          : i
      );
      saveItems(updated);
      render();
    }

    function groupByDate(items) {
      const map = {};
      items.forEach(item => {
        const key = item.purchasedAt.slice(0, 10);
        if (!map[key]) map[key] = [];
        map[key].push(item);
      });
      const entries = Object.entries(map).sort(
        (a, b) => new Date(b[0]) - new Date(a[0])
      );
      return entries;
    }

    // 상태
    let currentTab = "todo";
    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth() + 1;

    // 모달 상태
    let pendingPurchaseId = null;

    function setTab(tab) {
      currentTab = tab;
      const tabTodo = document.getElementById("tabTodo");
      const tabDone = document.getElementById("tabDone");
      const todoSection = document.getElementById("todoSection");
      const doneSection = document.getElementById("doneSection");
      const addBar = document.getElementById("addBar");

      if (tab === "todo") {
        tabTodo.classList.add("tab-active");
        tabDone.classList.remove("tab-active");
        todoSection.style.display = "block";
        doneSection.style.display = "none";
        addBar.style.display = "block";
      } else {
        tabTodo.classList.remove("tab-active");
        tabDone.classList.add("tab-active");
        todoSection.style.display = "none";
        doneSection.style.display = "block";
        addBar.style.display = "none";
      }
      render();
    }

    function openPurchaseModal(id) {
      pendingPurchaseId = id;
      document.getElementById("purchasePrice").value = "";
      document.getElementById("purchaseStore").value = "";
      const backdrop = document.getElementById("purchaseModalBackdrop");
      backdrop.style.display = "flex";
      document.getElementById("purchasePrice").focus();
    }

    function closePurchaseModal() {
      pendingPurchaseId = null;
      document.getElementById("purchaseModalBackdrop").style.display = "none";
    }

    function render() {
      const items = loadItems();

      // 살 것
      const todos = items.filter(i => i.status === "todo");
      const todoList = document.getElementById("todoList");
      const todoSub = document.getElementById("todoSub");

      if (todos.length === 0) {
        todoSub.style.display = "block";
        todoList.innerHTML = "";
      } else {
        todoSub.style.display = "none";
        todoList.innerHTML = todos.map(i => `
          <div class="card">
            <button class="check-btn" onclick="onTodoCheck('${i.id}')">
              <span class="check-icon">✓</span>
            </button>
            <div class="item-main">
              <div class="item-title">
                ${escapeHtml(i.title)}
                ${i.urgent ? '<span class="badge-urgent">긴급</span>' : ""}
              </div>
              ${i.desc ? `<div class="item-desc">${escapeHtml(i.desc)}</div>` : ""}
            </div>
            <button class="delete-btn" onclick="deleteItem('${i.id}')">×</button>
          </div>
        `).join("");
      }

      // 산 것
      const doneItemsAll = items.filter(i => i.status === "done" && i.purchasedAt);

      const monthLabel = document.getElementById("monthLabel");
      monthLabel.innerHTML = formatMonthLabel(currentYear, currentMonth);

      const doneList = document.getElementById("doneList");
      const doneEmpty = document.getElementById("doneEmpty");

      const monthItems = doneItemsAll.filter(i => {
        const d = new Date(i.purchasedAt);
        return d.getFullYear() === currentYear && d.getMonth() + 1 === currentMonth;
      });

      if (monthItems.length === 0) {
        doneEmpty.style.display = "block";
        doneList.innerHTML = "";
      } else {
        doneEmpty.style.display = "none";
        const grouped = groupByDate(monthItems);
        doneList.innerHTML = grouped.map(([dateKey, arr]) => {
          const total = arr.reduce((sum, item) => sum + (item.price || 0), 0);
          const rows = arr.map(item => `
            <div class="buy-row">
              <div class="buy-left">
                <div class="buy-store">${escapeHtml(item.store || "")}</div>
                <div class="buy-item">${escapeHtml(item.title)}</div>
              </div>
              <div class="buy-price">${formatPrice(item.price || 0)}</div>
            </div>
          `).join("");
          return `
            <div class="date-group">
              <div class="date-header">
                <div class="date-title">${formatDateLabel(dateKey)}</div>
                <div class="date-total">${formatPrice(total)}</div>
              </div>
              ${rows}
            </div>
          `;
        }).join("");
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 전역에서 쓰는 핸들러
    function onTodoCheck(id) {
      openPurchaseModal(id);
    }
    window.onTodoCheck = onTodoCheck;
    window.deleteItem = deleteItem;

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("greetingText").textContent = getDailyGreeting();
      document.getElementById("todayText").textContent = formatTodayKorean();

      document.getElementById("tabTodo").addEventListener("click", () => setTab("todo"));
      document.getElementById("tabDone").addEventListener("click", () => setTab("done"));

      // 월 변경
      document.getElementById("prevMonthBtn").addEventListener("click", () => {
        currentMonth--;
        if (currentMonth === 0) {
          currentMonth = 12;
          currentYear--;
        }
        render();
      });
      document.getElementById("nextMonthBtn").addEventListener("click", () => {
        currentMonth++;
        if (currentMonth === 13) {
          currentMonth = 1;
          currentYear++;
        }
        render();
      });

      // 추가하기
      const titleEl = document.getElementById("newTitle");
      const descEl = document.getElementById("newDesc");
      const urgentEl = document.getElementById("newUrgent");

      document.getElementById("addBtn").addEventListener("click", () => {
        const title = titleEl.value.trim();
        const desc = descEl.value.trim();
        const urgent = urgentEl.checked;

        if (!title) {
          alert("살 것 이름을 입력해 주세요.");
          titleEl.focus();
          return;
        }

        addItem(title, desc, urgent);
        titleEl.value = "";
        descEl.value = "";
        urgentEl.checked = false;
      });

      titleEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("addBtn").click();
        }
      });

      // 모달
      document.getElementById("cancelPurchaseBtn").addEventListener("click", () => {
        closePurchaseModal();
      });

      document.getElementById("confirmPurchaseBtn").addEventListener("click", () => {
        if (!pendingPurchaseId) return;

        const priceInput = document.getElementById("purchasePrice");
        const storeInput = document.getElementById("purchaseStore");

        const priceValue = Number(priceInput.value);
        if (!priceInput.value || isNaN(priceValue) || priceValue < 0) {
          alert("금액을 올바르게 입력해 주세요.");
          priceInput.focus();
          return;
        }

        const store = storeInput.value.trim() || "기타";
        markAsBought(pendingPurchaseId, priceValue, store);
        closePurchaseModal();
      });

      document.getElementById("purchaseModalBackdrop").addEventListener("click", (e) => {
        if (e.target.id === "purchaseModalBackdrop") {
          closePurchaseModal();
        }
      });

      // 초기 탭
      setTab("todo");
    });
  </script>
</body>
</html>
