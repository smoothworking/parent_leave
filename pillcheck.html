<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Pill Tracker</title>
    <style>
        :root {
            --bg: #F8F9FA;
            --card: #FFFFFF;
            --primary: #5BC27E;
            --text-main: #2D3436;
            --text-sub: #636E72;
            --line: #EDF2F7;
        }

        body { 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; 
            background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px;
            display: flex; justify-content: center;
        }

        .container { 
            width: 100%; max-width: 450px; 
            background: var(--card); border-radius: 24px; padding: 32px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* 헤더 & 탭 */
        .header { text-align: left; margin-bottom: 32px; }
        .header h1 { font-size: 16px; font-weight: 400; color: var(--text-sub); margin: 0; }
        .header .date { font-size: 22px; font-weight: 700; margin-top: 4px; }

        .tabs { display: flex; gap: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
        .tab { padding-bottom: 12px; font-size: 16px; font-weight: 600; cursor: pointer; color: #ADB5BD; position: relative; }
        .tab.active { color: var(--text-main); }
        .tab.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--text-main); }

        .content { display: none; }
        .content.active { display: block; animation: fadeIn 0.4s ease; }

        /* 오늘 탭 리스트 */
        .group-title { font-size: 14px; font-weight: 600; color: var(--text-sub); margin: 28px 0 12px; }
        .pill-card { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
        .check-box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #DFE6E9; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .check-box.checked { background: var(--primary); border-color: var(--primary); }
        .check-box.checked::after { content: '✓'; color: white; font-weight: bold; font-size: 14px; }

        /* 기록 탭 - 테이블 절대값 고정 수정 */
        .month-selector { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px 16px; border-radius: 12px; margin-bottom: 20px; }
        .btn-nav { border: none; background: none; cursor: pointer; font-size: 18px; color: var(--text-sub); }

        .table-wrapper { 
            overflow-x: auto; /* 가로 스크롤 */
            border-radius: 12px;
            background: #fff;
        }
        
        .history-table { 
            width: auto; /* 내용에 따라 너비 확장 */
            border-collapse: collapse; 
            table-layout: fixed; /* 테이블 레이아웃 고정 */
        }

        /* 첫 번째 열(날짜) 너비 */
        .history-table th:first-child, 
        .history-table td:first-child {
            width: 50px;
            min-width: 50px;
            position: sticky; /* 날짜 열 고정 (선택 사항) */
            left: 0;
            background: #fff;
            z-index: 1;
        }

        /* 영양제 열 너비 (절대값 고정) */
        .history-table th:not(:first-child), 
        .history-table td:not(:first-child) {
            width: 80px; /* 모든 영양제 열을 80px로 고정 */
            min-width: 80px;
        }

        .history-table th { 
            font-size: 12px; color: #B2BEC3; padding: 12px 0; font-weight: 500; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            border-bottom: 1px solid var(--line);
        }
        .history-table td { padding: 12px 0; text-align: center; font-size: 12px; color: var(--text-sub); border-bottom: 1px solid var(--line); }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #DFE6E9; }
        .dot.active { background: var(--primary); box-shadow: 0 0 8px rgba(91, 194, 126, 0.4); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>안녕하세요!</h1>
        <div class="date" id="displayDate"></div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('today')">오늘</div>
        <div class="tab" onclick="switchTab('record')">기록</div>
    </div>

    <div id="today" class="content active">
        <div id="pillList"></div>
    </div>

    <div id="record" class="content">
        <div class="month-selector">
            <button class="btn-nav" onclick="moveMonth(-1)">‹</button>
            <span id="currentMonthLabel" style="font-weight: 700;"></span>
            <button class="btn-nav" onclick="moveMonth(1)">›</button>
        </div>
        <div class="table-wrapper">
            <table class="history-table">
                <thead><tr id="tableHead"></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const CONFIG = {
        groups: { "아침 공복": ["유산균", "철분", "엽산"], "점심 직후": ["오메가3", "비타민D"] },
        allPills: ["유산균", "철분", "엽산", "오메가3", "비타민D"]
    };

    let viewDate = new Date();
    const todayKey = new Date().toISOString().split('T')[0];

    function init() {
        const now = new Date();
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        document.getElementById('displayDate').innerText = `${now.getMonth()+1}월 ${now.getDate()}일(${days[now.getDay()]})`;
        renderToday();
    }

    function switchTab(id) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById(id).classList.add('active');
        if(id === 'record') renderRecord();
    }

    function renderToday() {
        const container = document.getElementById('pillList');
        container.innerHTML = '';
        const data = JSON.parse(localStorage.getItem(todayKey) || '{}');

        for(const [group, pills] of Object.entries(CONFIG.groups)) {
            container.innerHTML += `<div class="group-title">${group}</div>`;
            pills.forEach(pill => {
                const checked = data[pill] ? 'checked' : '';
                container.innerHTML += `
                    <div class="pill-card">
                        <span class="pill-info">${pill}</span>
                        <div class="check-box ${checked}" onclick="togglePill('${pill}')"></div>
                    </div>`;
            });
        }
    }

    function togglePill(name) {
        let data = JSON.parse(localStorage.getItem(todayKey) || '{}');
        data[name] = !data[name];
        localStorage.setItem(todayKey, JSON.stringify(data));
        renderToday();
    }

    function moveMonth(offset) {
        viewDate.setMonth(viewDate.getMonth() + offset);
        renderRecord();
    }

    function renderRecord() {
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        document.getElementById('currentMonthLabel').innerText = `${year}년 ${month + 1}월`;

        const head = document.getElementById('tableHead');
        head.innerHTML = '<th>날짜</th>' + CONFIG.allPills.map(p => `<th>${p}</th>`).join('');

        const body = document.getElementById('tableBody');
        body.innerHTML = '';
        const lastDay = new Date(year, month + 1, 0).getDate();

        for(let d = 1; d <= lastDay; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            if(dateStr > todayKey) break;

            const dayData = JSON.parse(localStorage.getItem(dateStr) || '{}');
            let row = `<tr><td>${d}일</td>`;
            CONFIG.allPills.forEach(p => {
                row += `<td><span class="dot ${dayData[p] ? 'active' : ''}"></span></td>`;
            });
            body.innerHTML += row + `</tr>`;
        }
    }

    init();
</script>
</body>
</html>
